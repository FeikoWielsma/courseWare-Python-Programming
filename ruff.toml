# Ruff configuration for the courseware.
#
# This lives in its own file rather than in pyproject.toml on purpose. The
# student bundle ships this file but deliberately ships no pyproject.toml,
# because the setup exercise has the student create one with `uv init`. That
# exercise also has them install the Astral Ruff extension, so without a config
# of its own the editor would fall back to ruff's stock defaults and underline
# several hundred things in the course's own demo files, many of them the very
# patterns being taught.
#
# The paths below are relative to this file, and the student bundle keeps the
# same layout (demos/, solutions/, exercises/ as siblings), so the one file is
# correct in both places.
#
# Pin the rule set explicitly rather than riding on ruff's defaults, which
# widen between releases and would make the courseware appear to rot on its own.

target-version = "py314"
line-length = 100

# Editors and pre-commit hooks pass file names explicitly, and ruff lints a file
# named on the command line even when it is excluded. Without this the vendored
# code below would still be underlined in the student's editor.
force-exclude = true

exclude = [
    # Written badly on purpose : it is the file the linting slide runs ruff over,
    # and every finding in it is the lesson.
    "demos/01-pythonintro/03_ruff_findings.py",
    # archive/ holds what the course no longer uses : the calculator exercise
    # spine, demo folders no slide referenced (earlier versions of the course
    # and adjacent courses), and old exercise documents. Kept for trainers,
    # not built, not shipped, and held to no standard.
    "archive",
    # reference/ is background material for the student to browse: vendored
    # book source, GUI toolkit examples, notebooks. It is not course code and
    # is not held to the course's style.
    "reference",

    # PyInstaller sources beside the IO demos; not course material and not
    # shipped. The bundle allowlist in .forgejo/workflows/release.yml is the
    # authority on what does ship.
    "demos/09-python-io/createexecutable",
]

[lint]
select = [
    "A",     # shadowed builtins, a real trap in teaching code
    "B",     # bugbear
    "C4",    # comprehension style
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # modernisation refurb
    "I",     # import sorting
    "N",     # PEP 8 naming
    "PERF",  # obvious performance traps
    "PIE",   # misc lints
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "RUF",   # ruff-specific
    "SIM",   # simplifications
    "UP",    # pyupgrade, catches the Python 2 residue
    "W",     # pycodestyle warnings
]

ignore = [
    "E741",    # `l`, `I`, `O` as names; the maths demos use them deliberately
    "PLW0603", # `global`; the scope module teaches it on purpose
    "RUF012",  # ClassVar annotations would be noise in a pre-typing course
    "T201",    # print() is how a beginners course shows output
]

[lint.per-file-ignores]
# Package __init__ files re-export their contents on purpose; that re-export is
# itself the lesson in the modules chapter.
"**/__init__.py" = ["F401"]

# The modules chapter is *about* the import system: it manipulates sys.path
# before importing, reloads modules mid-file, and demonstrates
# `from x import *`.
"demos/06-modules/**" = ["E402", "F403", "F405"]

# The comprehensions chapter shows the explicit for-loop first and the
# comprehension second. PERF4xx would flag every one of those first halves,
# which is the half being taught. `strict=` on zip() is likewise a distraction
# ahead of the concept it qualifies.
"demos/07_comprehensions/**" = ["B905", "B912", "PERF401", "PERF402", "PERF403"]


# Where the anti-pattern is the lesson, it stays and the rule is turned off for
# that file with the reason written down. Do not "fix" any of these.

# The conversion-functions slide calls str('abc') to show what str() does.
"demos/02-variablesanddatatypes/06_conversionfunctions.py" = ["UP018"]

# These two slides teach str.format itself: the positional field numbers and the
# method call are the subject, so an f-string would delete the example.
"demos/02-variablesanddatatypes/10_stringformatting.py" = ["UP030", "UP031", "UP032"]
"demos/02-variablesanddatatypes/11_formatmethod.py" = ["UP030", "UP031", "UP032"]

# The sets demo writes duplicates on purpose, because dropping them is what a
# set does, and builds a set from a list literal to show the constructor.
"demos/03-datastructures/10_setsandfrozensets.py" = ["B033", "C405"]

# The tuple demo calls tuple() to show the constructor beside the literal.
"demos/03-datastructures/06_tuples.py" = ["C408"]

# The pass statement is the subject of its own slide, and an empty class body
# needs one.
"demos/04-controlflow/11_passstatement.py" = ["PIE790"]
"demos/11-python-classes/01_simplestclass.py" = ["PIE790"]

# The boolean operators demo shows raw precedence, including the short circuit
# that ruff would rather see written out or simplified away.
"demos/04-controlflow/14_booleanoperators.py" = ["RUF021", "SIM222", "SIM223"]

# Assigning a lambda to a name is exactly what the anonymous functions slide
# demonstrates.
"demos/05-functions/09_lambdafunctions.py" = ["E731"]

# The syntactic-sugar slide sets map with a lambda beside the comprehension it
# becomes; the map half is the form being recognised.
"demos/07_comprehensions/demo13_syntactic_sugar.py" = ["C417"]


# The dictionaries demo ends by deleting the dictionary and using it again, to
# show the NameError that follows.
"demos/03-datastructures/11_dictionaries.py" = ["F821"]

# The dictionary-methods demo repeats a key on purpose: the slide's comment is
# about which of the two values survives.
"demos/03-datastructures/12_dictionarymethods.py" = ["F601"]

# The IO chapter opens files without a context manager on purpose, so that the
# slide that introduces `with` has something to improve on, and it spells out
# the mode on every call because file modes are what the chapter is about.
"demos/09-python-io/**" = ["SIM115", "UP015"]


# The exceptions chapter shows a bare except before explaining why it is wrong,
# and closes files by hand before context managers; modes are spelled out
# because the IO chapter that follows is about them.
"demos/08-exceptionhandling/**" = ["B904", "E722", "SIM115", "UP015"]


