name: Build and Release Course Materials

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, check and verify, then report what the release would change. Publishes and syncs nothing.
        type: boolean
        default: false
      sync_tag:
        description: Build nothing; only synchronise the student repositories from this published release (e.g. build-1a2b3c4).
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.sync_tag }}
    runs-on: docker-build
    container:
      image: git.feikowielsma.nl/feiko/courseware-ci-image:latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install Bun 1.4 for Slidev
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.1"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Fetch the pinned Presentation-Template
        shell: bash
        env:
          PRESENTATION_TEMPLATE_REPOSITORY: ${{ github.server_url }}/SpiralTrain/Presentation-Template.git
        run: |
          echo "TEMPLATE=$(bun run build/toolchain.ts --path)" >> "$GITHUB_ENV"

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Check the lockfile is current
        shell: bash
        run: |
          uv lock --check
          uv lock --check --project libraries

      - name: Install the project
        shell: bash
        run: uv sync --frozen

      - name: Check the Python compiles
        shell: bash
        run: uv run python -m compileall -q demos solutions libraries/demos libraries/solutions

      - name: Check the slide code fences
        shell: bash
        run: uv run python "$TEMPLATE/build/tools/check-fences.py"

      - name: Check exercise slide references
        shell: bash
        run: uv run python "$TEMPLATE/build/tools/check-slide-references.py"

      - name: Check the exercise starters are current
        shell: bash
        run: uv run python "$TEMPLATE/build/tools/make-starters.py" --check

      - name: Check the exercise solutions
        shell: bash
        run: uv run python build/check-solutions.py

      - name: Check the quiz
        shell: bash
        run: uv run python build/site/check-quiz.py

      - name: Check the style
        shell: bash
        run: uv run ruff check .

      - name: Check optional libraries examples
        shell: bash
        run: |
          uv sync --project libraries --frozen
          uv run --project libraries python libraries/build/make-data.py --check
          uv run --project libraries python libraries/build/check-demos.py
          uv run --project libraries python libraries/build/check-solutions.py
          uv run --project libraries python libraries/build/check-outputs.py
          uv run --project libraries python libraries/build/native_states.py --check
          cd libraries
          uv run python "$TEMPLATE/build/tools/check-fences.py"

      - name: Build slides and exercises
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
          MARP_EXTRA_ARGS: --chrome-arg=--no-sandbox --chrome-arg=--disable-dev-shm-usage
        run: |
          cd build
          bun run check:animations
          bun run build -- --force
          bun run check:delivery
          bun run build:marp -- --force
          bun run build -- --exercises --force
          bun run site
          bun run libraries -- --skip-lint --force
          bun run libraries:marp -- --skip-lint --force
          bun run lint:libraries
          bun run libraries -- --exercises --force
          bun run verify -- fundamentals
          bun run verify -- libraries

      - name: Assemble and verify the student bundle
        shell: bash
        run: |
          bun run --cwd build bundle
          bun run --cwd build verify -- --bundle

          bun run --cwd build release -- --prepare

      - name: Save the reviewed upload set for independent publishing retries
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-${{ github.sha }}
          path: .courseware/release/upload.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: docker-build
    container:
      image: git.feikowielsma.nl/feiko/courseware-ci-image:latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install Bun 1.4 for Slidev
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.1"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Fetch the pinned Presentation-Template
        shell: bash
        env:
          PRESENTATION_TEMPLATE_REPOSITORY: ${{ github.server_url }}/SpiralTrain/Presentation-Template.git
        run: |
          echo "TEMPLATE=$(bun run build/toolchain.ts --path)" >> "$GITHUB_ENV"

      - name: Restore the reviewed upload set
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: release-${{ github.sha }}
          path: .courseware/release

      - name: Publish manifest assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--from .courseware/release/upload.zip)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          bun run --cwd build release -- "${args[@]}"

  sync:
    needs: [build, publish]
    if: ${{ !cancelled() && !inputs.dry_run && (needs.publish.result == 'success' || inputs.sync_tag) }}
    runs-on: docker-build
    container:
      image: git.feikowielsma.nl/feiko/courseware-ci-image:latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install Bun 1.4 for Slidev
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.1"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Fetch the pinned Presentation-Template
        shell: bash
        env:
          PRESENTATION_TEMPLATE_REPOSITORY: ${{ github.server_url }}/SpiralTrain/Presentation-Template.git
        run: |
          echo "TEMPLATE=$(bun run build/toolchain.ts --path)" >> "$GITHUB_ENV"

      - name: Synchronise the student repository and its GitHub mirror
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDENT_REPO_SSH_KEY: ${{ secrets.STUDENT_REPO_SSH_KEY }}
          STUDENT_MIRROR_DEPLOY_KEY: ${{ secrets.STUDENT_MIRROR_DEPLOY_KEY }}
          SYNC_TAG: ${{ inputs.sync_tag }}
        run: |
          args=(--release)
          if [[ -n "$SYNC_TAG" ]]; then args+=("$SYNC_TAG"); fi
          bun run --cwd build sync-student -- "${args[@]}"
