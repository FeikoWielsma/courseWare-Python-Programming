name: Build and Release Course Materials

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, check and verify, then report what the release would change. Publishes and syncs nothing.
        type: boolean
        default: false
      sync_tag:
        description: Build nothing; only synchronise the student repositories from this published release (e.g. build-1a2b3c4).
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.sync_tag }}
    runs-on: docker-build
    container:
      image: git.feikowielsma.nl/feiko/courseware-ci-image:latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install Bun 1.4 for Slidev
        shell: bash
        run: |
          bun_bin="${BUN_INSTALL:-$HOME/.bun}/bin"
          # An image that already carries this Bun needs no download.
          if [[ "$("$bun_bin/bun" --version 2>/dev/null)" != "1.4.1" ]]; then
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.1"
          fi
          echo "$bun_bin" >> "$GITHUB_PATH"
          export PATH="$bun_bin:$PATH"
          bun --version

      - name: Fetch the pinned Presentation-Template
        shell: bash
        env:
          PRESENTATION_TEMPLATE_REPOSITORY: ${{ github.server_url }}/SpiralTrain/Presentation-Template.git
          # The image's Chrome (CHROME_PATH) does all rendering; Puppeteer's own ~680 MB of browsers is not needed.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          template=$(bun run build/toolchain.ts --path)
          echo "TEMPLATE=$template" >> "$GITHUB_ENV"

      - name: Install uv
        shell: bash
        run: |
          if ! command -v uv > /dev/null; then curl -LsSf https://astral.sh/uv/install.sh | sh; fi
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Check the lockfile is current
        shell: bash
        run: |
          uv lock --check
          uv lock --check --project libraries

      - name: Install the project
        shell: bash
        run: |
          uv sync --frozen
          uv sync --project libraries --frozen

      # One readable release pipeline; exhaustive animation/demo checks are optional.
      - name: Check and build slides and exercises
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
          MARP_EXTRA_ARGS: --chrome-arg=--no-sandbox --chrome-arg=--disable-dev-shm-usage
        run: |
          set -o pipefail
          mkdir -p .courseware/ci
          bash build/ci-build.sh 2>&1 | tee .courseware/ci/ci-build.log

      # Forgejo shows no job logs through its API: keep this one retrievable for diagnosing a failed run.
      - name: Keep the gate log
        if: ${{ always() }}
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: ci-build-log-${{ github.sha }}
          path: .courseware/ci/ci-build.log
          retention-days: 14

      - name: Assemble and verify the student bundle
        shell: bash
        run: |
          bun run --cwd build bundle
          bun run --cwd build verify -- --bundle

          bun run --cwd build release -- --prepare

      - name: Save the reviewed upload set for independent publishing retries
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-${{ github.sha }}
          path: .courseware/release/upload.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: docker-build
    container:
      image: git.feikowielsma.nl/feiko/courseware-ci-image:latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install Bun 1.4 for Slidev
        shell: bash
        run: |
          bun_bin="${BUN_INSTALL:-$HOME/.bun}/bin"
          # An image that already carries this Bun needs no download.
          if [[ "$("$bun_bin/bun" --version 2>/dev/null)" != "1.4.1" ]]; then
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.1"
          fi
          echo "$bun_bin" >> "$GITHUB_PATH"
          export PATH="$bun_bin:$PATH"
          bun --version

      - name: Fetch the pinned Presentation-Template
        shell: bash
        env:
          PRESENTATION_TEMPLATE_REPOSITORY: ${{ github.server_url }}/SpiralTrain/Presentation-Template.git
          # The image's Chrome (CHROME_PATH) does all rendering; Puppeteer's own ~680 MB of browsers is not needed.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          template=$(bun run build/toolchain.ts --path)
          echo "TEMPLATE=$template" >> "$GITHUB_ENV"

      - name: Restore the reviewed upload set
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: release-${{ github.sha }}
          path: .courseware/release

      - name: Publish manifest assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--from .courseware/release/upload.zip)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          bun run --cwd build release -- "${args[@]}"

  sync:
    needs: [build, publish]
    if: ${{ !cancelled() && !inputs.dry_run && (needs.publish.result == 'success' || inputs.sync_tag) }}
    runs-on: docker-build
    container:
      image: git.feikowielsma.nl/feiko/courseware-ci-image:latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install Bun 1.4 for Slidev
        shell: bash
        run: |
          bun_bin="${BUN_INSTALL:-$HOME/.bun}/bin"
          # An image that already carries this Bun needs no download.
          if [[ "$("$bun_bin/bun" --version 2>/dev/null)" != "1.4.1" ]]; then
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.1"
          fi
          echo "$bun_bin" >> "$GITHUB_PATH"
          export PATH="$bun_bin:$PATH"
          bun --version

      - name: Fetch the pinned Presentation-Template
        shell: bash
        env:
          PRESENTATION_TEMPLATE_REPOSITORY: ${{ github.server_url }}/SpiralTrain/Presentation-Template.git
          # The image's Chrome (CHROME_PATH) does all rendering; Puppeteer's own ~680 MB of browsers is not needed.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          template=$(bun run build/toolchain.ts --path)
          echo "TEMPLATE=$template" >> "$GITHUB_ENV"

      - name: Synchronise the student repository and its GitHub mirror
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDENT_REPO_SSH_KEY: ${{ secrets.STUDENT_REPO_SSH_KEY }}
          STUDENT_MIRROR_DEPLOY_KEY: ${{ secrets.STUDENT_MIRROR_DEPLOY_KEY }}
          SYNC_TAG: ${{ inputs.sync_tag }}
        run: |
          args=(--release)
          if [[ -n "$SYNC_TAG" ]]; then args+=("$SYNC_TAG"); fi
          bun run --cwd build sync-student -- "${args[@]}"
